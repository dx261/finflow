name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finflow
          POSTGRES_PASSWORD: finflow
          POSTGRES_DB: finflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finflow -d finflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://finflow:finflow@127.0.0.1:5432/finflow
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - working-directory: backend
        run: uv sync --frozen --all-groups
      - working-directory: backend
        run: uv run ruff check app tests
      - working-directory: backend
        run: uv run black --check app tests alembic/versions
      - working-directory: backend
        run: uv run mypy app
      - working-directory: backend
        run: uv run alembic upgrade head && uv run alembic check
      - working-directory: backend
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint:check
      - working-directory: frontend
        run: npm run test
      - working-directory: frontend
        run: npm run build
