# FinFlow Nginx configuration.
#
# Production hardening (HTTPS termination, security headers, request
# limits, compression) is completed in TASK-002. This file provides the
# base routing: Vue static assets at "/" and the API under "/api/".
#
# The mounted default server block used by the container is defined in
# the compose setup as nginx/default.conf; this file documents the
# routing contract and can be used directly when the frontend is served
# from the nginx image.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    upstream finflow_api {
        server api:8000;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Vue SPA routing.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # API reverse proxy.
        location /api/ {
            proxy_pass http://finflow_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Swagger / OpenAPI docs.
        location /docs/ {
            proxy_pass http://finflow_api;
            proxy_set_header Host $host;
        }
    }
}
