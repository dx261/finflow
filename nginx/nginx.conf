# FinFlow production Nginx configuration (TASK-002/005/056/057/060).
#
# Serves the built Vue SPA from /usr/share/nginx/html and reverse-proxies
# /api and /docs to the backend. Only Nginx is exposed to the outside
# world.
#
# Security hardening applied here:
#   - server_tokens off            (no version banner)
#   - security headers             (X-Content-Type-Options, CSP, frame etc.)
#   - gzip compression
#   - request body limit           (must stay above max_upload_size_mb)
#   - longer proxy timeouts        (statement uploads / parsing)
#   - immutable caching for hashed assets
#
# TLS: an HTTPS server block is provided at the bottom but disabled by
# default. To enable it, uncomment the block and mount your certificate
# and key at /etc/nginx/ssl/fullchain.pem and /etc/nginx/ssl/privkey.pem.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    # Compression.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Statement uploads can exceed the 20MB file cap a little (multipart
    # overhead), so allow up to 25MB.
    client_max_body_size 25m;

    # Security headers.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Default-src 'self' + API data: images can be remote (bank logos).
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # API upstream.
    upstream finflow_api {
        server api:8000;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Vue SPA routing: fall back to index.html.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache hashed build assets aggressively, never revalidate.
        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # API reverse proxy (upload-safe timeouts).
        location /api/ {
            proxy_pass http://finflow_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Swagger / OpenAPI docs.
        location /docs/ {
            proxy_pass http://finflow_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /redoc {
            proxy_pass http://finflow_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/v1/openapi.json {
            proxy_pass http://finflow_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Deny dotfiles.
        location ~ /\. {
            deny all;
        }
    }

    # ==================================================================
    # TLS termination (disabled by default). Uncomment and mount your
    # certificates at /etc/nginx/ssl/ to activate HTTPS and redirect HTTP.
    # ==================================================================
    # server {
    #     listen 80;
    #     server_name _;
    #     return 301 https://$host$request_uri;
    # }
    #
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name _;
    #
    #     ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_session_cache   shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #
    #     root /usr/share/nginx/html;
    #     index index.html;
    #
    #     location / {
    #         try_files $uri $uri/ /index.html;
    #     }
    #
    #     location /assets/ {
    #         try_files $uri =404;
    #         expires 1y;
    #         add_header Cache-Control "public, immutable";
    #     }
    #
    #     location /api/ {
    #         proxy_pass http://finflow_api;
    #         proxy_http_version 1.1;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto https;
    #         proxy_set_header X-Request-ID $request_id;
    #         proxy_read_timeout 300s;
